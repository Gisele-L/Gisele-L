# Salve este arquivo no repositório Gisele-L/Gisele-L em: .github/workflows/snake.yml
# Ele gera a cobrinha do README a partir do seu gráfico de contribuições
# e publica as imagens na branch "output".

name: Cobrinha de contribuições

on:
  schedule:
    - cron: "0 3 * * *" # todo dia à meia-noite (horário de Brasília)
  workflow_dispatch: # permite rodar manualmente pela aba Actions
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Gerar a animação nas cores do perfil
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#1E1B4B&color_dots=#ebedf0,#c9cdfa,#a1a8f5,#7a83f1,#5560e3
            dist/snake-dark.svg?palette=github-dark&color_snake=#C7CBFF&color_dots=#161b22,#2a2f6b,#3b4399,#5059cf,#7d86ff

      - name: Publicar as imagens na branch output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
